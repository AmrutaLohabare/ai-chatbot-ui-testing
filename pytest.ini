[pytest]
testpaths = tests
markers =
    ui: chatbot UI behaviour tests (Task 1)
    ai_eval: DeepEval evaluation tests (Task 2)
addopts =
    -v
    --browser chromium
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --output test-results
    --html=reports/test_report.html
    --self-contained-html
